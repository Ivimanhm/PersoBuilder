[package]
name = "perso-builder"
version = "1.0.1"
description = "Perso Builder: generador de equipos y gestor Fearless para League of Legends"
authors = ["Perso Builder"]
edition = "2021"

[lib]
name = "perso_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Perso-Builder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rand = "0.8"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
url = "2"
